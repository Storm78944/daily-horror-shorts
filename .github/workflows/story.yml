name: Generate Dark Tales Video

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - ".github/workflows/story.yml"

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow groq

      - name: Generate horror video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: dark-tales-video
          path: horror-short.mp4
          if-no-files-found: error
